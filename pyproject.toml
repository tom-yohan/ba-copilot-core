[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-copilot-local"
version = "0.1.0"
description = "Local-first business analysis assistant using Ollama"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.scripts]
ba = "ba_copilot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
